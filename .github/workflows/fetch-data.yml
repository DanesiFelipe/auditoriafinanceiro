name: Fetch Freshservice Tickets

on:
  schedule:
    # Roda a cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        env:
          FRESHSERVICE_DOMAIN: ${{ secrets.FRESHSERVICE_DOMAIN }}
          FRESHSERVICE_API_KEY: ${{ secrets.FRESHSERVICE_API_KEY }}
          WORKSPACE_ID: '24'
          SERVICE_ITEM_IDS: '477,476'
          # AUDIT_YEAR: '2025'  # Descomente para filtrar por ano específico. Se vazio = todos os anos.
        run: node scripts/fetch-tickets.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/tickets.json
          git commit -m "chore: atualiza tickets do freshservice (auditoria)" || exit 0
          git pull --rebase origin main
          git push
